<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Slideshow</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="slideshow-body">
  <div class="spotify-controls">
    <button id="spotifyPlay" type="button">Play</button>
    <button id="spotifyStop" type="button">Stop</button>
  </div>
  <iframe
    id="spotifyPlayer"
    class="spotify-player"
    src=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"
    title="Spotify Web Player"
  ></iframe>
  <div id="emptyState">Waiting for photos...</div>
  <img id="slide" class="hidden" alt="AI slide" />
  <script src="/static/slideshow.js"></script>
</body>
</html>
