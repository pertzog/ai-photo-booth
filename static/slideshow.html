<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Slideshow</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="slideshow-body">
  <div class="spotify-controls">
    <button id="spotifyConnect" type="button">Connect Spotify</button>
    <button id="spotifyPlay" type="button">Play</button>
    <button id="spotifyStop" type="button">Stop</button>
  </div>
  <div id="spotifyStatus" class="spotify-status">Spotify not connected</div>
  <div id="emptyState">Waiting for photos...</div>
  <img id="slide" class="hidden" alt="AI slide" />
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="/static/slideshow.js"></script>
</body>
</html>
