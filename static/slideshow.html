<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Slideshow</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="slideshow-body">
  <div id="musicPanel" class="music-panel" aria-live="polite">
    <div class="music-actions">
      <button id="spotifyConnectBtn" type="button">Connect Spotify</button>
      <button id="spotifyDisconnectBtn" type="button">Disconnect</button>
    </div>
    <div id="spotifyStatus" class="music-status">Not connected</div>
    <div id="trackInfo" class="track-info hidden">
      <img id="trackArt" class="track-art hidden" alt="Album art" />
      <div id="trackMeta" class="track-meta"></div>
    </div>
  </div>
  <div id="emptyState">Waiting for photos...</div>
  <img id="slide" class="hidden" alt="AI slide" />
  <script src="/static/slideshow.js"></script>
</body>
</html>
